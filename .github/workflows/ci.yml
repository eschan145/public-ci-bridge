name: Private source CI (public worker)
on:
  repository_dispatch:
    types: [private-ci-v1]
  workflow_dispatch:
    inputs:
      project:
        description: Registered project ID
        required: true
      sha:
        description: Exact 40-character source commit
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.client_payload.project || inputs.project }}-${{ github.event.client_payload.sha || inputs.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'private-ci-v1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate trusted project configuration
        shell: bash
        env:
          PROJECT: ${{ github.event.client_payload.project || inputs.project }}
          SHA: ${{ github.event.client_payload.sha || inputs.sha }}
        run: python scripts/validate.py "$PROJECT" "$SHA"
      - name: Create read-only private-source credential
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ vars.SOURCE_OWNER }}
          permission-contents: read
      - name: Checkout exact private source commit
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT: ${{ github.event.client_payload.project || inputs.project }}
          SHA: ${{ github.event.client_payload.sha || inputs.sha }}
        run: |
          python scripts/checkout.py "$PROJECT" "$SHA"
      - name: Configure, build and test
        shell: bash
        env:
          PROJECT: ${{ github.event.client_payload.project || inputs.project }}
          SHA: ${{ github.event.client_payload.sha || inputs.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/run_build.py "$PROJECT" "$SHA" "$PLATFORM"
